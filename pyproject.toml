[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-cookidoo"
version = "1.0.0"
description = "MCP server for Thermomix & Cookidoo: create recipes with guided cooking (TM6/TM7 modes, Varoma, Turbo), search recipes, plan your week and fill your shopping list"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tobias Meindl" }, { name = "Alexandre Patelli" }]
keywords = [
    "mcp", "mcp-server", "model-context-protocol", "thermomix", "cookidoo", "tm6", "tm7",
    "claude", "recipes", "meal-planning", "shopping-list", "guided-cooking",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "fastmcp>=2.0",
    "cookidoo-api>=0.19.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black"]

[project.scripts]
mcp-cookidoo = "mcp_cookidoo.server:main"

[project.urls]
Homepage = "https://github.com/tobilektri/mcp-cookidoo"
Repository = "https://github.com/tobilektri/mcp-cookidoo"
Issues = "https://github.com/tobilektri/mcp-cookidoo/issues"

[tool.hatch.build.targets.wheel]
packages = ["mcp_cookidoo"]

[tool.hatch.build.targets.sdist]
include = ["mcp_cookidoo", "test_*.py", "fixtures", "server.py", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
